<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phân Tích Tài/Xỉu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4 text-center text-primary">Phân Tích Tài/Xỉu</h1>

    <div class="mb-4">
      <h5>1. Phân tích từ file CSV</h5>
      <input type="file" id="fileInput" accept=".csv" class="form-control mb-2"/>
      <button onclick="analyze()" class="btn btn-primary">Phân tích file</button>
    </div>

    <div class="mb-4">
      <h5>2. Nhập thủ công</h5>
      <input type="text" id="manualInput" placeholder="Ví dụ: 3,4,5" class="form-control mb-2"/>
      <button onclick="addManualEntry()" class="btn btn-secondary">Thêm dữ liệu</button>
    </div>

    <div class="mb-4">
      <h5>3. Phân tích từ hình ảnh</h5>
      <input type="file" id="imageInput" accept="image/*" class="form-control"/>
      <p class="text-muted">(Chức năng này đang được phát triển...)</p>
    </div>

    <div class="card p-3 mb-4">
      <h4 class="card-title">Kết quả phân tích</h4>
      <div id="results"></div>
    </div>

    <div class="card p-3 mb-4">
      <h4 class="card-title">Biểu đồ tổng điểm</h4>
      <canvas id="chart" height="100"></canvas>
    </div>

    <div class="card p-3 mb-4">
      <h4 class="card-title">Lịch sử kết quả</h4>
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>#</th>
            <th>Tổng điểm</th>
            <th>Kết quả</th>
            <th>Loại nhập</th>
          </tr>
        </thead>
        <tbody id="historyTable"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
